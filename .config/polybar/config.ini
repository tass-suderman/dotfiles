[colors]
background = #552222
background-alt = #770000
foreground = #ddeedd
primary = #FFFFFF
secondary = #FF3333
alert = #FF5500
disabled = #000000

[bar/example]
width = 100%
height = 24pt
radius = 0 
scroll-up = "#i3.prev"
scroll-down = "#i3.next"
tray-position = right

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #000000

padding-left = 0
padding-right = 1

module-margin = 1 

separator = |
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMonoNL Nerd Font;2
font-1 = JetBrainsMonoNL Nerd Font:size=20;2
# modules-left = i3 lightsout
modules-left = i3 
modules-right = pulseaudio xkeyboard eth date
#modules-right = pulseaudio xkeyboard memory cpu wlan eth date

# old version modules-left = i3 lightsout xwindow 
# old version modules-right = filesystem pulseaudio xkeyboard memory cpu wlan eth date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; tray-position = right

; wm-restack = generic
; wm-restack = bspwm
wm-restack = i3

; override-redirect = true
[bar/monitor1-2]
inherit = bar/example
monitor = DP1-2
tray-position = none

[bar/monitor1-1]
inherit = bar/example
monitor = DP1-1
tray-position = none
#[module/system-gpu-intel]
#type = custom/script
#exec = sudo ~/.config/polybar/system-gpu-intel.sh
#interval = 20

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/i3]
type = internal/i3

; Only show workspaces defined on the same output as the bar
;
; Useful if you want to show monitor specific workspaces
; on different bars
;
; Default: false
pin-workspaces = true

; Show urgent workspaces regardless of whether the workspace is actually hidden 
; by pin-workspaces.
;
; Default: false
; New in version 3.6.0
show-urgent = true

; This will split the workspace name on ':'
; Default: false
strip-wsnumbers = true

; Sort the workspaces by index instead of the default
; sorting that groups the workspaces by output
; Default: false
index-sort = true

; Create click handler used to focus workspace
; Default: true
enable-click = true

; Create scroll handlers used to cycle workspaces
; Default: true
enable-scroll = true

; Wrap around when reaching the first/last workspace
; Default: true
wrapping-scroll = true

; Set the scroll cycle direction 
; Default: true
reverse-scroll = false

; Use fuzzy (partial) matching on labels when assigning 
; icons to workspaces
; Example: code;♚ will apply the icon to all workspaces 
; containing 'code' in the label
; Default: false
fuzzy-match = true
; ws-icon-[0-9]+ = <label>;<icon>
; NOTE: The <label> needs to match the name of the i3 workspace
; Neither <label> nor <icon> can contain a semicolon (;)
ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;3
ws-icon-3 = 4;4
ws-icon-4 = 5;5
ws-icon-5 = 6;6 
ws-icon-6 = 7;7
ws-icon-7 = 8;8
ws-icon-8 = 9;9
ws-icon-9 = 0;

ws-icon-default = ♟
; NOTE: You cannot skip icons, e.g. to get a ws-icon-6
; you must also define a ws-icon-5.
; NOTE: Icon will be available as the %icon% token inside label-*

; Available tags:
;   <label-state> (default) - gets replaced with <label-(focused|unfocused|visible|urgent)>
;   <label-mode> (default)
format = <label-state> <label-mode>

; Available tokens:
;   %mode%
; Default: %mode%
label-mode = %mode%
label-mode-padding = 2
label-mode-background = #e60053

; Available tokens:
;   %name%
;   %icon%
;   %index%
;   %output%
; Default: %icon% %name%
label-focused = %icon%
label-focused-foreground = #330000
label-focused-background = #ffdddd
label-focused-underline = #ff6666
label-focused-padding = 4

; Available tokens:
;   %name%
;   %icon%
;   %index%
;   %output%
; Default: %icon% %name%
label-unfocused = %icon%
label-unfocused-padding = 4

; Available tokens:
;   %name%
;   %icon%
;   %index%
;   %output%
; Default: %icon% %name%
label-visible = %index%
label-visible-underline = #555555
label-visible-padding = 4

; Available tokens:
;   %name%
;   %icon%
;   %index%
;   %output%
; Default: %icon% %name%
label-urgent = %index%
label-urgent-foreground = #000000
label-urgent-background = #bd2c40
label-urgent-padding = 4

; Separator in between workspaces
label-separator = |
label-separator-padding = 2
label-separator-foreground = #ffb52a


[module/pulseaudio]
type = internal/pulseaudio

# format-volume-prefix = <ramp-volume> 
format-volume-prefix-foreground = ${colors.primary}
format-volume = <ramp-volume> <label-volume>

label-volume = %percentage%%


ramp-volume-0 = %{T2}%{T-}
ramp-volume-1 = %{T2}%{T-}
ramp-volume-2 = %{T2}󰕾%{T-} 
ramp-volume-3 = %{T2}%{T-}
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = 
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = %{T2}󰍛 %{T-}
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = %{T2}󰻠 %{T-} 
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected


#[module/wlanex]
#inherit = network-base
#interface-type = wireless
#label-connected = %{F#FF6644}%{T2} %{T-}%{F-} %essid% %local_ip%
#label-disconnected = 

#[module/ethex]
#inherit = network-base
#interface-type = wired
#label-connected = %{F#FF6644}%{T2}󰈀 %{T-}%{F-} %local_ip% %downspeed%
#label-disconnected = 

[module/wlan]
inherit = network-base
interface-type = wireless
format-connected = <ramp-signal>
label-disconnected = %{F#FF0000}%{T2}󰤮 %{T-}%{F-}

ramp-signal-0 =  %{F#FF6644}%{T2}󰤮 %{T-}%{F-}
ramp-signal-1 =  %{F#FF6644}%{T2}󰤯 %{T-}%{F-}
ramp-signal-2 =  %{F#FF6644}%{T2}󰤟 %{T-}%{F-}
ramp-signal-3 =  %{F#FF6644}%{T2}󰤢 %{T-}%{F-}
ramp-signal-4 =  %{F#FF6644}%{T2}󰤥 %{T-}%{F-}
ramp-signal-5 =  %{F#FF6644}%{T2}󰤨 %{T-}%{F-}


[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#FF6644}%{T2}󰈀 %{T-}%{F-} %downspeed%
label-disconnected = %{F#FF0000}%{T2}󰈂 %{T-}%{F-}

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[module/lightsout]
type = custom/menu
label-open = %{T2} 󰍜 %{T-} 
label-close = %{F#FF0000}%{T2} 󰛉 %{T-}%{F-}
menu-0-0 = %{T2} 󰀻 %{T-}
menu-0-0-exec = #lightsout.open.1
menu-0-1 = %{T2}  %{T-}
menu-0-1-exec = #lightsout.open.2
menu-1-0 = %{T2}  %{T-} 
menu-1-0-exec = firefox
menu-1-1 = %{T2} 󰙯 %{T-}
menu-1-1-exec = discord
menu-1-2 = %{T2}  %{T-}
menu-1-2-exec = spotify-launcher
menu-2-0 =%{T2}  %{T-}
menu-2-0-exec = kill -9 $(ps -e | grep picom | awk '{ print $1 }')
menu-2-1 = %{T2}  %{T-} 
menu-2-1-exec = exec picom -r 16 -i 0.8 -f -e 0.6 --active-opacity 0.9 --vsync -b
menu-2-2 = %{T2} 󰸉 %{T-}
menu-2-2-exec = feh --bg-fill ~/Downloads/Shinsha_Minimal.png

menu-2-3 = %{T2} 󰍺 %{T-}

menu-2-3-exec = xrandr --output DP-1-2 -s 1920x1200_59.96 --primary --right-of HDMI-1-1 && xrandr --output DP-1-1 -s 1920x1080 --rotate left --right-of DP-1-2 && xrandr --output HDMI-1-1 -s 1920x1080 && xrandr --output eDP-1 --off;  feh --bg-fill ~/Downloads/Shinsha_Minimal.png
menu-2-4 = %{T2}  %{T-}
menu-2-4-exec = #lightsout.open.3

menu-3-0 = " 0 "
menu-3-0-exec = pactl set-default-sink 0
menu-3-1 = " 1 "
menu-3-1-exec = pactl set-default-sink 1
menu-3-2 = " 2 "
menu-3-2-exec = pactl set-default-sink 2
menu-3-3 = " 3 "
menu-3-3-exec = pactl set-default-sink 3

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
