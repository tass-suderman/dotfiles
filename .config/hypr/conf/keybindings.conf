#################
### Variables ###
#################
$main_mod = SUPER 

$mod_super = Shift
$return_key = Return
$tab_key = Tab
$dot_key_code = 60
$print_screen = Print
$left_control = control
$ws1 = 1
$ws2 = 2
$ws3 = 3
$ws4 = 4
$ws5 = 5
$ws6 = 6
$ws7 = 7
$ws8 = 8
$ws9 = 9
$ws0 = 0

# [Open File Browser]
$file_browser = b
# Open code workspace [Move to Code Workspace]
$code_key = c
# Focus Down [Move Down]
$vim_down = e
# Toggle Fullscreen [Launch Librewolf]
$fullscreen_key = f
# Connect Sony Headphones
$bluetooth_connection_key = g
# Focus Up [Move Up]
$vim_up = i
# Toggle Split
$split_key = j
# Launch Element
$element_key = l
# Focus Left [Move Left]
$vim_left = n
# Focus Right [Move Right]
$vim_right = o
# Open Feishin [Exit Hyprland]
$power_key = p
# [Kill Current Window]
$kill_key = q
# App Launcher [Command Launcher]
$rofi_launch = r
# Go to Scratchpad Workspace [Move to Scratchpad Workspace]
$scratchpad_key = s
# Toggle Floating [Open Clipboard History]
$clipboard_key = v
# Open Window Switcher
$window_switcher_key = w
# [Edit Last Screenshot]
$edit_screenshot_key = x
# Toggle Layout
$layout_key = z

###################
### KEYBINDINGS ###
###################
# See https://wiki.hypr.land/Configuring/Binds/ for more

### B
bind = $main_mod $mod_super, $file_browser, exec, $launcher_script browser

### C
bind = $main_mod, $code_key, togglespecialworkspace, code
bind = $main_mod $mod_super, $code_key, movetoworkspace, special:code

### E
bind = $main_mod, $vim_down, exec, $window_control_script focus d
bind = $main_mod, Down, exec, $window_control_script focus d
bind = $main_mod $mod_super, $vim_down, exec, $window_control_script window d
bind = $main_mod $mod_super, Down, exec, $window_control_script window d

### F
bind = $main_mod, $fullscreen_key, fullscreen
bind = $main_mod $mod_super, $fullscreen_key, exec, $browser

### G
bind = $main_mod, $bluetooth_connection_key, exec, bluetoothctl connect $bluetooth_headphones_id

### I
bind = $main_mod, $vim_up, exec, $window_control_script focus u
bind = $main_mod, Up, exec, $window_control_script focus u
bind = $main_mod $mod_super, $vim_up, exec, $window_control_script window u
bind = $main_mod $mod_super, Up, exec, $window_control_script window u

### J
bind = $main_mod, $split_key, togglesplit

### L
bind = $main_mod, $element_key, exec, $chat_client

### N
bind = $main_mod, $vim_left, exec, $window_control_script focus l
bind = $main_mod, Left, exec, $window_control_script focus l
bind = $main_mod $mod_super, $vim_left, exec, $window_control_script window l
bind = $main_mod $mod_super, Left, exec, $window_control_script window l

### O
bind = $main_mod, $vim_right, exec, $window_control_script focus r
bind = $main_mod, Right, exec, $window_control_script focus r
bind = $main_mod $mod_super, $vim_right, exec, $window_control_script window r
bind = $main_mod $mod_super, Right, exec, $window_control_script window r

### P
bind = $main_mod, $power_key, exec, $music_player
bind = $main_mod $mod_super, $power_key, exec, $launcher_script power

### Q
bind = $main_mod $mod_super, $kill_key, killactive

### R
bind = $main_mod, $rofi_launch, exec, $launcher_script drun
bind = $main_mod $mod_super, $rofi_launch, exec, $launcher_script run

### S
bind = $main_mod, S, togglespecialworkspace, magic
bind = $main_mod $mod_super, S, movetoworkspace, special:magic

### V
bind = $main_mod, $clipboard_key, exec, $window_control_script special
bind = $main_mod $mod_super, $clipboard_key, exec, $launcher_script clipboard

### W
bind = $main_mod, $window_switcher_key, exec, $launcher_script window

### X
bind = $main_mod $mod_super, $edit_screenshot_key, exec, $edit_screenshot_script

### Z
bind = $main_mod, $layout_key, exec, $toggle_layout_script

### .
bind = $main_mod, $dot_key_code, exec, $launcher_script emoji

### Return
bind = $main_mod, $return_key, exec, $terminal

### Print
bind = $left_control, $print_screen, exec, $screenshot_tool

### 0-9
bind = $main_mod, $ws1, workspace, $ws1
bind = $main_mod, $ws2, workspace, $ws2
bind = $main_mod, $ws3, workspace, $ws3
bind = $main_mod, $ws4, workspace, $ws4
bind = $main_mod, $ws5, workspace, $ws5
bind = $main_mod, $ws6, workspace, $ws6
bind = $main_mod, $ws7, workspace, $ws7
bind = $main_mod, $ws8, workspace, $ws8
bind = $main_mod, $ws9, workspace, $ws9
bind = $main_mod, $ws0, workspace, $ws0
bind = $main_mod $mod_super, $ws1, movetoworkspace, $ws1
bind = $main_mod $mod_super, $ws2, movetoworkspace, $ws2
bind = $main_mod $mod_super, $ws3, movetoworkspace, $ws3
bind = $main_mod $mod_super, $ws4, movetoworkspace, $ws4
bind = $main_mod $mod_super, $ws5, movetoworkspace, $ws5
bind = $main_mod $mod_super, $ws6, movetoworkspace, $ws6
bind = $main_mod $mod_super, $ws7, movetoworkspace, $ws7
bind = $main_mod $mod_super, $ws8, movetoworkspace, $ws8
bind = $main_mod $mod_super, $ws9, movetoworkspace, $ws9
bind = $main_mod $mod_super, $ws0, movetoworkspace, $ws0

# Scroll through existing workspaces with mainMod + scroll
bind = $main_mod, mouse_down, workspace, e+1
bind = $main_mod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $main_mod, mouse:272, movewindow
bindm = $main_mod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @D,EFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

